[project]
name = "geosamroad"
version = "0.1.0"
description = "Repository for GeoSAMRoad data and deployment code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml",
    "pandas>=3.0.2",
]

[project.optional-dependencies]

globalurbanmapper = [
    "earthengine-api>=1.4.0",
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "scikit-image>=0.22.0",
    "shapely>=2.1.2",
]

sentinel2 = [
    "sknw",
    "scikit-image",
    "opencv-python",
    "earthengine-api>=1.7.22",
    "geopandas>=1.1.3",
    "rasterio>=1.5.0",
    "opencv-python",
    "shapely>=2.1.2",
    "pyarrow>=23.0.1",
    "jenkspy>=0.4.1",
    "typer>=0.24.1",
    "rioxarray>=0.22.0",
    # "torch>=2.11.0",
    "pyogrio>=0.12.1",
]

geosamroad = [
    # training
    "lightning",
    "torch>=2.1.0",
    "torchvision>=0.25.0",
    "torchmetrics",
    "wandb",
    # models
    "terratorch",
    "segmentation-models-pytorch",
    "segment-anything",
    "huggingface-hub",
    "torchgeo>=0.9.0,<0.10",
    # dataset
    "rasterio>=1.5.0",
    "geopandas>=1.1.3",
    "shapely>=2.1.2",
    "pyarrow",
    "opencv-python",
    "pydantic>=2.13.4",
    "addict",
    "albumentations>=2.0.8",
    # graphs and utility
    "igraph",
    "rtree",
    "scipy",
    "scikit-learn",
    "scikit-image>=0.26.0",
    "networkx",
    "numba",
    "tcod",
    "imageio",
    # graph metrics
    "hopcroftkarp",
    "svgwrite",
    # misc
    "psutil",
    "matplotlib>=3.10.8",
    "kagglehub",
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocstrings[python]>=1.0.4",
]


[tool.uv.sources]
instageo = { git = "https://github.com/kelviy/InstaGeo-E2E-Geospatial-ML.git" }
terratorch = { git = "https://github.com/terrastackai/terratorch.git" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

torch = [ { index = "pytorch-cu128", marker = "sys_platform == 'linux'" } ]
torchvision = [ { index = "pytorch-cu128", marker = "sys_platform == 'linux'" } ]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",  # Apple Silicon Mac
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]


[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch", "packaging", "setuptools", "wheel", "ninja"]
causal-conv1d = ["torch", "packaging", "setuptools", "wheel", "ninja"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocstrings[python]>=1.0.4",
    "typer>=0.24.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/geosamroad", "src/sentinel2data", "src/globalurbanmapper_gee"]
