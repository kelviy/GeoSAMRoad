[project]
name = "geosamroad"
version = "0.1.0"
description = "Repository for GeoSAMRoad data and deployment code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pyyaml",
    "pandas>=2.0.0",
]

[project.optional-dependencies]

globalurbanmapper = [
    "earthengine-api>=1.4.0",
    "numpy>=1.24.0",
    "rasterio>=1.3.0",
    "scikit-image>=0.22.0",
    "shapely>=2.0.0",
]

sentinel2 = [
    "sknw",
    "scikit-image",
    "opencv-python-headless",   # server: no GUI libs in the image
    "earthengine-api>=1.7.22",
    "geopandas>=0.14.0",
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyarrow>=18.0.0",
    "jenkspy>=0.4.1",
    "typer>=0.24.1",
    "rioxarray>=0.22.0",
    # "torch>=2.11.0",
    "pyogrio>=0.12.1",
]

geosamroad = [
    # training
    "lightning",
    "torch>=2.1.0",
    "torchvision>=0.20.0",
    "torchmetrics",
    "wandb",
    # models
    "terratorch",
    "segmentation-models-pytorch",
    "segment-anything",
    "huggingface-hub",
    "torchgeo>=0.9.0,<0.10",
    # dataset
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow",
    "opencv-python-headless",   # server: no GUI libs in the image
    "pydantic>=2.13.4",
    "addict",
    "albumentations>=2.0.8",
    # graphs and utility
    "igraph",
    "rtree",
    "scipy",
    "scikit-learn",
    "scikit-image>=0.22.0",
    "networkx",
    "numba",
    "tcod",
    "imageio",
    # graph metrics
    "hopcroftkarp",
    "svgwrite",
    # misc
    "psutil",
    "matplotlib>=3.7.0",
    "kagglehub",
]

# Hosted notebooks (Kaggle/Colab). Same as `geosamroad` minus torch/torchvision,
# which the host image already ships with a matching CUDA build, and minus
# terratorch, whose dependency tree raises numpy far enough to break the image's
# prebuilt numba. Covers unet/sgcn training, the threshold sweep and inference;
# a terramind run on a hosted notebook additionally needs terratorch.
kaggle = [
    # training
    "lightning",
    "torchmetrics",
    "wandb",
    # models
    "segmentation-models-pytorch",
    "segment-anything",
    # dataset
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow",
    "opencv-python-headless",
    "pydantic>=2.13.4",
    "addict",
    "albumentations>=2.0.8",
    # graphs and utility
    "igraph",
    "rtree",
    "scipy",
    "scikit-learn",
    "scikit-image>=0.22.0",
    "networkx",
    "numba",
    "tcod",
    "imageio",
    # misc
    "matplotlib>=3.7.0",
]

# The web app
app = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pillow>=10.0.0",   # true-colour tile previews
]

docs = [
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocstrings[python]>=1.0.4",
]


[tool.uv.sources]
instageo = { git = "https://github.com/kelviy/InstaGeo-E2E-Geospatial-ML.git" }
terratorch = { git = "https://github.com/terrastackai/terratorch.git" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git" }

torch = [ { index = "pytorch-cu128", marker = "sys_platform == 'linux'" } ]
torchvision = [ { index = "pytorch-cu128", marker = "sys_platform == 'linux'" } ]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",  # Apple Silicon Mac
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]


[tool.uv.extra-build-dependencies]
mamba-ssm = ["torch", "packaging", "setuptools", "wheel", "ninja"]
causal-conv1d = ["torch", "packaging", "setuptools", "wheel", "ninja"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "src"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs-gen-files>=0.6.1",
    "mkdocs-literate-nav>=0.6.3",
    "mkdocstrings[python]>=1.0.4",
    "typer>=0.24.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/geosamroad",
    "src/sentinel2data",
    "src/globalurbanmapper_gee",
    "src/geosamroad_app",
]
