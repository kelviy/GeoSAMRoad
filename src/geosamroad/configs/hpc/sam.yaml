DATASET: ROSA
DATASET_DIR: /scratch/user/data/ROSADataset

# ======================= encoder =======================
ENCODER_MODEL: sam
RGB_INPUT: true
RGB_SOURCE: enhanced
PRETRAINED: true
SAM_VERSION: vit_b
SAM_CKPT_PATH: /scratch/user/pretrain_checkpoints/sam_vit_b_01ec64.pth

# ======================= input geometry ================
CROP_SIZE: 128
UPSCALE: 2

# ======================= data ==========================
AUGMENT: true
TRAIN_LEN_FACTOR: 10.0
MIN_ROAD_DENSITY: 0.0
MIN_CROP_ROAD_PX: 50
MAX_CROP_ATTEMPTS: 20
PRELOAD_GRAPHS: true      # cache graphs
KEYPOINT_BUFFER_M: 10.0

# ======================= training ======================
BATCH_SIZE: 16
DATA_WORKER_NUM: 4
TRAIN_EPOCHS: 100
BASE_LR: 1.0e-3
ENCODER_LR_FACTOR: 0.1
WEIGHT_DECAY: 0.0
LR_MILESTONES: [70,]
LR_GAMMA: 0.1
PRECISION: 32
GRADIENT_CLIP_VAL: 1.0
ACCUMULATE_GRAD_BATCHES: 1
SEED: 42

# ======================= loss ==========================
MASK_LOSS: bce_dice

# ======================= TopoNet =======================
TOPO_SAMPLE_NUM: 128
TOPONET_VERSION: normal
ROAD_NMS_RADIUS: 8            # spacenet is 16
NEIGHBOR_RADIUS: 32           # spacenet is 64
MAX_NEIGHBOR_QUERIES: 16
ITSC_NMS_RADIUS: 4

# ======================= logging =======================
RUN_NAME: sam
WANDB_PROJECT: geosamroad
WANDB_ENTITY: null
WANDB_MODE: null
CHECKPOINT_DIR: /scratch/user/output/sam_geosamroad
LOG_EVERY_N_STEPS: 10
SAVE_TOP_K: 1
MONITOR: road_iou
MONITOR_MODE: max

# ======================= inference =====================
INFER_BATCH_SIZE: 16
INFER_PATCHES_PER_EDGE: 16
ITSC_THRESHOLD: 0.3098
ROAD_THRESHOLD: 0.3216
TOPO_THRESHOLD: 0.5294

# ======================= skeletonisation =====================
THIN_BEFORE_NMS: true
THIN_HOLE_SIZE: 16