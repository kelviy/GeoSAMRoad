# Detector thresholds and toggles for the `detect` command.
# Each run records this whole config in the zone GeoPackage's detector_runs layer.
# Values are provisional (KEL-11) and are tuned during cleaning.
# Usage:
#   python -m sentinel2data.cli detect --zones-dir <package-zones output> --detector-config <this file>

# A road end within this distance of another road is connected to it.
connect_tolerance_m: 0.5
# A road end within this distance of the zone boundary was cut by the zone
# edge, not a real dead end.
zone_edge_tolerance_m: 1.0

# Gap: a dangling road end within max_distance_m of another road gets a
# proposed connector to that road's nearest point, or to the end of that road
# row when the end lies within snap_to_end_m of the nearest point. The end's
# own road, and roads touching it, don't count.
gap:
  enabled: true
  max_distance_m: 30.0
  snap_to_end_m: 5.0

# Dangling stub: a road with a dead end, shorter than max_length_m.
stub:
  enabled: true
  max_length_m: 30.0

# Second source: compare the labels with Overture roads.
#   missing?  a stretch where Overture has a road and the labels don't.
#   phantom?  a stretch of label with no Overture road nearby.
# Flags are areas only, never Overture geometry (Overture is ODbL).
overture:
  enabled: true
  # GeoParquet with a road_class column; `~` is expanded.
  path: ~/Documents/RoadVectorData/clean_road_data/overture_dense.parquet
  # A sample within this distance of a line of the other source is matched.
  match_tolerance_m: 15.0
  # Both line sets are sampled at most this far apart.
  sample_spacing_m: 5.0
  # Shorter unmatched stretches get no flag.
  missing_min_length_m: 100.0
  phantom_min_length_m: 50.0
  # Overture road classes whose unmatched roads get missing? flags. Labels are
  # matched against every class. A class not listed here is off.
  missing_classes:
    motorway: true
    motorway_link: true
    trunk: true
    trunk_link: true
    primary: true
    primary_link: true
    secondary: true
    secondary_link: true
    tertiary: true
    tertiary_link: true
    residential: true
    living_street: true
    unclassified: true
    # Faint vehicle tracks are not roads under the ROSA definition.
    track: false

# Duplicate, flag only: a road row with at least min_overlap_share of its
# length within max_distance_m of one other row. Rows shorter than
# min_length_m are skipped: near a junction most of a short row lies within
# max_distance_m of the road it meets.
duplicate:
  enabled: true
  max_distance_m: 10.0
  min_overlap_share: 0.8
  min_length_m: 20.0

# Unnoded crossing, flag only: two roads that cross at a point that is not a
# vertex of both.
crossing:
  enabled: true
